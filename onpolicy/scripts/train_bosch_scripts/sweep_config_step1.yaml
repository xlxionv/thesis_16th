program: /Users/nhi/thesis_14th-1/onpolicy/scripts/train_bosch_scripts/run_sweep_step1.py
command:
  - ${env}
  - python3
  - ${program}
  - ${args}
run_cap: 30
method: bayes
metric:
  name: Eval_Costs/TOTAL
  goal: minimize

parameters:
  # --- PPO / RL core ---
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  critic_lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  entropy_coef:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  clip_param:
    distribution: uniform
    min: 0.1
    max: 0.4
  ppo_epoch:
    distribution: int_uniform
    min: 5
    max: 20
  gamma:
    distribution: uniform
    min: 0.95
    max: 0.999
  gae_lambda:
    distribution: uniform
    min: 0.90
    max: 0.99

  # --- Step 1 reward shaping ---
  # Machine Agent: penalises each setup changeover (scale-invariant, main learning signal)
  dense_setup_penalty:
    distribution: uniform
    min: 0.5
    max: 5.0
  # Machine Agent: bonus for producing (balances setup penalty, prevents idle policy)
  dense_production_reward:
    distribution: uniform
    min: 0.5
    max: 3.0
  # Kill switch: flat penalty when any demand goes unmet; must dominate normal rewards
  kill_switch_penalty:
    values: [100.0, 500.0, 1000.0, 2000.0, 5000.0]

  # --- Network ---
  hidden_size:
    values: [64, 128, 256]
